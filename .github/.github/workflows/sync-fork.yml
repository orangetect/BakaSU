name: Sync fork with upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPOSITORY: LancelotRar/best-cf-ips
  # 在这里配置你需要同步的分支，多个分支用空格隔开，例如： "main dev gh-pages"
  TARGET_BRANCHES: "main"

jobs:
  sync:
    name: Sync fork multiple branches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote & Sync branches
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPOSITORY }}.git
          git fetch upstream

          # 循环同步每一个指定的分支
          for branch in ${{ env.TARGET_BRANCHES }}; do
            echo "======================================"
            echo "开始同步分支: $branch"
            echo "======================================"

            # 切换到目标分支（如果本地没有但远程有，则创建跟踪分支）
            git checkout "$branch" || git checkout -b "$branch" "origin/$branch"

            # 合并上游对应分支的更新
            git merge "upstream/$branch" --no-edit

            # 推送到你自己的仓库
            git push origin "$branch"
          done
